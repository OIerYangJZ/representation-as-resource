    semantic_structure: exponentiated diagonal blocks
  - id: phase_polynomial_blocks
    class: natural_positive
    description: Dense nested-parity phase-polynomial blocks.
    semantic_structure: exact parity table
  - id: negative_random_clifford_rz
    class: negative_control
    description: Random Clifford and RZ sequence without repeated commuting support.
    semantic_structure: none expected
  - id: negative_routing_dominated
    class: negative_control
    description: Long-range Clifford interactions and swaps with unique phase terms.
    semantic_structure: routing dominates
strongest_external_baseline:
  method_id: external_tket_paulisimp
  tool: pytket
  version: runtime_frozen
  pass_sequence:
    - DecomposeBoxes
    - RemoveRedundancies
    - PauliSimp
    - RemoveRedundancies
    - AutoRebase_CX_Rz_H
    - RemoveRedundancies
predeclared_success_criteria:
  positive_family:
    - completed_valid for authors and external baseline
    - authors gates and CX no worse at every primary all_to_all density=1 cell
    - authors runtime strictly lower at every primary scale and seed
  negative_controls:
    - all-on authors gates, depth, and CX no worse than all-off in median
    - paired 95 percent bootstrap interval must not show a positive quality regression
  factorial:
    - report all six main effects and all pairwise interactions
    - retain failures and status-only cells
